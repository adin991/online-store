<div class="login-page">

  <!-- Left Panel -->
  <div class="left-panel">
    <div class="left-content">
      <h1>{{ 'AUTH.TAGLINE' | translate }}</h1>
      <p>{{ 'AUTH.TAGLINE_SUB' | translate }}</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="form-container">
      <h2>{{ 'AUTH.REGISTER_TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'AUTH.REGISTER_SUBTITLE' | translate }}</p>

      <form [formGroup]="form" (ngSubmit)="signUp()" novalidate>
      <div class="form-group">
        <label for="reg-name">{{ 'AUTH.FIRST_NAME' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="reg-name" type="text" formControlName="name" [placeholder]="'AUTH.FIRST_NAME' | translate" class="form-input" autocomplete="given-name" />
        </div>
        <app-field-error [control]="form.controls.name"></app-field-error>
      </div>

      <div class="form-group">
        <label for="reg-surname">{{ 'AUTH.LAST_NAME' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="reg-surname" type="text" formControlName="surname" [placeholder]="'AUTH.LAST_NAME' | translate" class="form-input" autocomplete="family-name" />
        </div>
        <app-field-error [control]="form.controls.surname"></app-field-error>
      </div>

      <div class="form-group">
        <label for="reg-gender">{{ 'AUTH.GENDER' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <select id="reg-gender" formControlName="gender" class="form-input">
            <option [ngValue]="0">{{ 'AUTH.MALE' | translate }}</option>
            <option [ngValue]="1">{{ 'AUTH.FEMALE' | translate }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">{{ 'AUTH.EMAIL' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input id="reg-email" type="email" formControlName="email" placeholder="name@example.com" class="form-input" autocomplete="email" />
        </div>
        <app-field-error [control]="form.controls.email"></app-field-error>
      </div>

      <div class="form-group">
        <label for="reg-password">{{ 'AUTH.PASSWORD' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="reg-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••" class="form-input" autocomplete="new-password" />
          <button class="toggle-password" type="button" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="password-strength" *ngIf="password.length > 0">
          <div class="strength-bars">
            <span class="bar" [style.background]="strengthBars >= 1 ? strengthColor : '#e0e0e0'"></span>
            <span class="bar" [style.background]="strengthBars >= 2 ? strengthColor : '#e0e0e0'"></span>
            <span class="bar" [style.background]="strengthBars >= 3 ? strengthColor : '#e0e0e0'"></span>
            <span class="bar" [style.background]="strengthBars >= 4 ? strengthColor : '#e0e0e0'"></span>
          </div>
          <span class="strength-label" [style.color]="strengthColor">{{ strengthLabelKey | translate }}</span>
        </div>
        <app-field-error [control]="form.controls.password"></app-field-error>
      </div>

      <button class="signin-btn" type="submit" [disabled]="isLoading">
        {{ isLoading ? ('AUTH.LOADING' | translate) : ('AUTH.SIGN_UP' | translate) }}
        <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      </form>

      <div class="divider"><span>{{ 'AUTH.OR' | translate }}</span></div>

      <button class="guest-btn" routerLink="/">{{ 'AUTH.CONTINUE_GUEST' | translate }}</button>

      <p class="register-row">
        {{ 'AUTH.HAVE_ACCOUNT' | translate }}
        <a class="signup-link" routerLink="/auth/login">{{ 'AUTH.SIGN_IN_LINK' | translate }}</a>
      </p>
    </div>
  </div>

</div>
