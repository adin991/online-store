<div class="login-page">

  <!-- Left Panel -->
  <div class="left-panel">
    <div class="left-content">
      <h1>{{ 'AUTH.TAGLINE' | translate }}</h1>
      <p>{{ 'AUTH.TAGLINE_SUB' | translate }}</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="form-container">
      <h2>{{ 'AUTH.LOGIN_TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>

      <form [formGroup]="form" (ngSubmit)="signIn()" novalidate>
      <div class="form-group">
        <label for="login-email">{{ 'AUTH.EMAIL' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input id="login-email" type="email" placeholder="name@example.com" class="form-input" formControlName="email" autocomplete="email" />
        </div>
        <app-field-error [control]="form.controls.email"></app-field-error>
      </div>

      <div class="form-group">
        <label for="login-password">{{ 'AUTH.PASSWORD' | translate }}</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="login-password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" class="form-input" formControlName="password" autocomplete="current-password" />
          <button class="toggle-password" type="button" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <app-field-error [control]="form.controls.password"></app-field-error>
      </div>

      <div class="forgot-row">
        <a href="#" class="forgot-link">{{ 'AUTH.FORGOT_PASSWORD' | translate }}</a>
      </div>

      <button class="signin-btn" type="submit" [disabled]="isLoading">
        {{ isLoading ? '...' : ('AUTH.SIGN_IN' | translate) }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      </form>

      <div class="divider"><span>{{ 'AUTH.OR' | translate }}</span></div>

      <button class="guest-btn" routerLink="/">{{ 'AUTH.CONTINUE_GUEST' | translate }}</button>

      <p class="register-row">
        {{ 'AUTH.NO_ACCOUNT' | translate }}
        <a class="signup-link" routerLink="/auth/register">{{ 'AUTH.SIGN_UP_LINK' | translate }}</a>
      </p>
    </div>
  </div>

</div>
