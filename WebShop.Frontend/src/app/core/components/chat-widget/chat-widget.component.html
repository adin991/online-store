<div class="chat-widget">
  <button class="chat-toggle" (click)="toggle()" [class.open]="isOpen">
    <svg *ngIf="!isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <svg *ngIf="isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <div class="chat-panel" *ngIf="isOpen">
    <div class="chat-header">
      <span>{{ 'CHAT.TITLE' | translate }}</span>
    </div>

    <div class="chat-messages">
      <div class="chat-empty" *ngIf="messages.length === 0">
        {{ 'CHAT.EMPTY' | translate }}
      </div>
      <div
        *ngFor="let m of messages"
        class="chat-bubble"
        [class.user]="m.role === 'user'"
        [class.model]="m.role === 'model'"
      >
        {{ m.text }}
      </div>
    </div>

    <div class="chat-input-row">
      <input
        type="text"
        [placeholder]="'CHAT.PLACEHOLDER' | translate"
        [formControl]="draft"
        (keyup.enter)="send()"
      />
      <button (click)="send()" [disabled]="isSending || draft.invalid">
        {{ isSending ? '...' : ('CHAT.SEND' | translate) }}
      </button>
    </div>
  </div>
</div>
