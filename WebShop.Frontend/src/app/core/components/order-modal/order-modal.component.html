<div class="order-modal-overlay" *ngIf="modal.data() as data" (click)="modal.close()">
  <div class="order-modal" (click)="$event.stopPropagation()">
    <button class="order-modal-close" (click)="modal.close()">&times;</button>
    <div class="order-modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <h3>{{ data.title }}</h3>
    <p>{{ data.message }}</p>
    <button class="order-modal-ok" (click)="modal.close()">OK</button>
  </div>
</div>
